name: PCB CI

on:
  push:
  pull_request:

jobs:
  hardware-checks:
    runs-on: ubuntu-latest
    env:
      KICAD_IMAGE: ghcr.io/inti-cmnb/kicad10_auto:latest
      PCB_PLOT_LAYERS: F.Cu,In1.Cu,In2.Cu,In3.Cu,In4.Cu,B.Cu,F.Paste,B.Paste,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts

    steps:
      - uses: actions/checkout@v7

      - name: Run KiCad ERC on project schematics
        run: |
          mkdir -p reports/erc

          find hardware -name "*.kicad_pro" | while read project; do
            dir=$(dirname "$project")
            base=$(basename "$project" .kicad_pro)
            sch="$dir/$base.kicad_sch"

            if [ ! -f "$sch" ]; then
              echo "No top-level schematic found for $project, skipping"
              continue
            fi

            echo "Running ERC for $sch"

            report_base=$(basename "$sch" .kicad_sch)

            docker run --rm \
              -v "$PWD:/workspace" \
              "$KICAD_IMAGE" \
              kicad-cli sch erc "/workspace/$sch" \
                --output "/workspace/reports/erc/${report_base}.rpt"
          done

      - name: Run KiCad DRC on project PCBs
        run: |
          mkdir -p reports/drc

          find hardware -name "*.kicad_pro" | while read project; do
            dir=$(dirname "$project")
            base=$(basename "$project" .kicad_pro)
            pcb="$dir/$base.kicad_pcb"

            if [ ! -f "$pcb" ]; then
              echo "No PCB found for $project, skipping"
              continue
            fi

            echo "Running DRC for $pcb"

            report_base=$(basename "$pcb" .kicad_pcb)

            docker run --rm \
              -v "$PWD:/workspace" \
              "$KICAD_IMAGE" \
              kicad-cli pcb drc "/workspace/$pcb" \
                --output "/workspace/reports/drc/${report_base}.rpt"
          done

      - name: Generate KiCad plots for project PCBs
        run: |
          mkdir -p output/plots

          find hardware -name "*.kicad_pro" | while read project; do
            dir=$(dirname "$project")
            base=$(basename "$project" .kicad_pro)
            pcb="$dir/$base.kicad_pcb"

            if [ ! -f "$pcb" ]; then
              echo "No PCB found for $project, skipping"
              continue
            fi

            echo "Generating plots for $pcb"

            mkdir -p "output/plots/$base"

            docker run --rm \
              -v "$PWD:/workspace" \
              "$KICAD_IMAGE" \
              kicad-cli pcb export pdf \
                --layers "$PCB_PLOT_LAYERS" \
                --mode-single \
                --output "/workspace/output/plots/$base/${base}-pcb.pdf" \
                "/workspace/$pcb"

            docker run --rm \
              -v "$PWD:/workspace" \
              "$KICAD_IMAGE" \
              kicad-cli pcb export svg \
                --layers "$PCB_PLOT_LAYERS" \
                --mode-multi \
                --output "/workspace/output/plots/$base/svg" \
                "/workspace/$pcb"
          done

      - name: Generate fabrication files with KiCad CLI
        run: |
          mkdir -p output/fabrication

          find hardware -name "*.kicad_pro" | while read project; do
            dir=$(dirname "$project")
            base=$(basename "$project" .kicad_pro)
            sch="$dir/$base.kicad_sch"
            pcb="$dir/$base.kicad_pcb"

            if [ ! -f "$sch" ] || [ ! -f "$pcb" ]; then
              echo "Project files missing for $project, skipping"
              continue
            fi

            echo "Processing $project"

            mkdir -p "output/fabrication/$base"
            mkdir -p "output/fabrication/$base/gerbers"
            mkdir -p "output/fabrication/$base/drill"

            docker run --rm \
              -v "$PWD:/workspace" \
              "$KICAD_IMAGE" \
              kicad-cli pcb export gerbers \
                --output "/workspace/output/fabrication/$base/gerbers" \
                --layers "$PCB_PLOT_LAYERS" \
                "/workspace/$pcb"

            docker run --rm \
              -v "$PWD:/workspace" \
              "$KICAD_IMAGE" \
              kicad-cli pcb export drill \
                --output "/workspace/output/fabrication/$base/drill" \
                --format excellon \
                "/workspace/$pcb"

            docker run --rm \
              -v "$PWD:/workspace" \
              "$KICAD_IMAGE" \
              kicad-cli pcb export pos \
                --format csv \
                --units mm \
                --side both \
                --output "/workspace/output/fabrication/$base/${base}-position.csv" \
                "/workspace/$pcb"

            docker run --rm \
              -v "$PWD:/workspace" \
              "$KICAD_IMAGE" \
              kicad-cli sch export bom \
                --output "/workspace/output/fabrication/$base/${base}-bom.csv" \
                "/workspace/$sch"
          done

      - name: Zip fabrication packages
        run: |
          cd output/fabrication

          for dir in */ ; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Upload PCB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcb-ci-artifacts
          path: |
            reports/
            output/
