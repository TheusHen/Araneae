kibot:
  version: 1

global:
  output: "%f-%i.%x"

outputs:

  # GERBERS
  - name: gerbers
    type: gerber
    dir: gerbers
    options:
      use_aux_axis_as_origin: true
      subtract_mask_from_silk: true

  # DRILL FILES
  - name: drill
    type: excellon
    dir: drill

  # PICK AND PLACE
  - name: position
    type: position
    dir: fabrication
    options:
      format: CSV

  # BOM
  - name: bom
    type: bom
    dir: fabrication
    options:
      format: csv

  # STEP 3D MODEL
  - name: step
    type: step
    dir: 3d
