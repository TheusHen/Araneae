kibot:
  version: 1

global:
  output: "%f-%i.%x"

preflight:
  run_drc: true
  run_erc: true
  check_zone_fills: true
  ignore_unconnected: false

outputs:

  # GERBERS
  - name: gerbers
    type: gerber
    dir: gerbers
    options:
      use_aux_axis_as_origin: true
      subtract_mask_from_silk: true

  # DRILL FILES
  - name: drill
    type: excellon
    dir: drill

  # PICK AND PLACE
  - name: position
    type: position
    dir: fabrication
    options:
      format: CSV

  # BOM
  - name: bom
    type: bom
    dir: fabrication
    options:
      format: csv

  # SCHEMATIC PDF
  - name: schematic_pdf
    type: pdf_sch
    dir: docs

  # PCB PDF
  - name: pcb_pdf
    type: pdf_pcb
    dir: docs

  # SVG PCB
  - name: pcb_svg
    type: svg
    dir: docs

  # STEP 3D MODEL
  - name: step
    type: step
    dir: 3d

  # RENDER 3D
  - name: render_top
    type: render_3d
    dir: renders
    options:
      view: top

  - name: render_bottom
    type: render_3d
    dir: renders
    options:
      view: bottom